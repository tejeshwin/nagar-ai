[pytest]
# Pytest configuration for Civic Complaint Intelligence Engine tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Path configuration
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings

# Markers for categorizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    audio: Tests related to audio processing
    image: Tests related to image processing
    location: Tests related to location extraction
    api: Tests for API endpoints

# Coverage options (if using pytest-cov)
# addopts = --cov=. --cov-report=html --cov-report=term

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (if using pytest-timeout)
# timeout = 300

# Mocking settings
# asyncio_mode = auto
